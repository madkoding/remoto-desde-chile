name: dependabot-automerge
# Integra solos los PR de Dependabot de npm (patch y minor) cuando el CI pasa.
# Los PR que tocan .github/workflows (GitHub Actions) y las versiones mayores se revisan a mano:
# el GITHUB_TOKEN no puede modificar archivos de workflows.
on:
  pull_request:
  schedule:
    - cron: "0 14 * * *"     # barrido diario de PR que ya existían
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  al-abrir:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrar si cumple la política
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Con una regla de rama que exija checks, el auto-merge espera al CI.
          gh pr merge --auto --squash "$PR_URL" && exit 0
          # Sin regla de rama: esperar a que terminen los checks y luego integrar.
          sleep 20
          gh pr checks "$PR_URL" --watch --fail-fast --interval 10
          gh pr merge --squash "$PR_URL"

  barrido:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Integrar PR de npm de Dependabot con CI en verde
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --author "app/dependabot" --state open --json number,headRefName,title,statusCheckRollup |
          jq -c '.[]' | while read -r pr; do
            n=$(jq -r .number <<<"$pr"); rama=$(jq -r .headRefName <<<"$pr"); titulo=$(jq -r .title <<<"$pr")
            case "$rama" in dependabot/npm_and_yarn/*) ;; *) echo "#$n: no es npm, se deja para revisión manual"; continue;; esac
            desde=$(sed -E 's/.* from ([0-9]+)\..* to ([0-9]+)\..*/\1/' <<<"$titulo"); hasta=$(sed -E 's/.* from ([0-9]+)\..* to ([0-9]+)\..*/\2/' <<<"$titulo")
            [ "$desde" = "$hasta" ] || { echo "#$n: versión mayor, revisión manual"; continue; }
            ok=$(jq '[.statusCheckRollup[] | select(.conclusion != null) | .conclusion] | (length > 0) and all(. == "SUCCESS" or . == "SKIPPED" or . == "NEUTRAL")' <<<"$pr")
            [ "$ok" = "true" ] || { echo "#$n: CI sin completar o con fallos"; continue; }
            echo "#$n: integrando"; gh pr merge "$n" --repo "$REPO" --squash
          done
